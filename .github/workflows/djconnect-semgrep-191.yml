name: DJConnect shared Semgrep CI

on:
  workflow_call:
    inputs:
      config:
        description: Semgrep config path or URL.
        required: false
        type: string
        default: ""
      continue-on-error:
        description: Report Semgrep results without failing the workflow.
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  security-events: write

jobs:
  software-assurance-governance:
    name: Software Assurance governance
    permissions:
      contents: read
    uses: djconnect-music-dj/djconnect-shared-workflows/.github/workflows/software-assurance-governance-631f.yml@93754e9cb2253e8ec06e3255340ac372192493a8
    with:
      execution_profile: balanced
      owner: ${{ github.repository }}

  semgrep:
    name: Semgrep
    continue-on-error: ${{ inputs.continue-on-error }}
    runs-on: ubuntu-latest
    steps:
      - id: canonical-source
        name: Resolve canonical configuration repository by immutable ID
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const result = await github.request("GET /repositories/{repository_id}", {repository_id: 1258575431});
            const repo = result.data;
            if (repo.id !== 1258575431 || repo.private !== false || !["pcvantol/djconnect", "djconnect-music-dj/djconnect"].includes(repo.full_name)) throw new Error("Unexpected canonical configuration repository identity");
            core.setOutput("repository", repo.full_name);
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: ${{ inputs.config || format('https://raw.githubusercontent.com/{0}/main/.semgrep/djconnect-security.yml', steps.canonical-source.outputs.repository) }}
