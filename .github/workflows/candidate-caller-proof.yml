name: Candidate caller proof
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  governance-balanced:
    if: github.event.pull_request.head.ref == 'codex/shared-root-candidate-validation'
    uses: ./.github/workflows/software-assurance-governance-5f12.yml
    with:
      execution_profile: balanced
      owner: djconnect-music-dj/djconnect-shared-workflows
  governance-release:
    if: github.event.pull_request.head.ref == 'codex/shared-root-candidate-validation'
    uses: ./.github/workflows/software-assurance-governance-5f12.yml
    with:
      execution_profile: release
      owner: djconnect-music-dj/djconnect-shared-workflows
  semgrep:
    if: github.event.pull_request.head.ref == 'codex/shared-root-candidate-validation'
    uses: ./.github/workflows/candidate-inline-governance-proof.yml
